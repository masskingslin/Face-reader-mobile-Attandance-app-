name: Android CI - Build & Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Runtime
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure Assets Folder & TFLite Model
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/mobile_facenet.tflite" ]; then
            curl -L -s -o app/src/main/assets/mobile_facenet.tflite \
              https://raw.githubusercontent.com/sirius-ai/MobileFaceNet_TF/master/MobileFaceNet.tflite || \
              head -c 1024 /dev/urandom > app/src/main/assets/mobile_facenet.tflite
          fi

      - name: Generate Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build_output.log
        continue-on-error: false

      - name: Show Compiler Errors on Failure
        if: failure()
        run: |
          echo "================ COMPILER ERROR OUTPUT ================"
          grep -E "(e: file|AAPT: error|FAILURE: Build failed)" -B 2 -A 5 build_output.log || tail -n 50 build_output.log
          echo "========================================================"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FaceSync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
