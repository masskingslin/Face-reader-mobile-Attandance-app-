name: Build & Publish Release (APK + AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Signed Binaries & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Runtime
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in repository. Generating wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Decode Keystore from Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > app/keystore.jks
          else
            echo "WARNING: SIGNING_KEY secret is not set."
          fi

      - name: Build Signed Release APK & Bundle
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Organize Artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/release/FaceAttendance-${TAG_NAME}.apk
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            mv app/build/outputs/bundle/release/app-release.aab \
               app/build/outputs/bundle/release/FaceAttendance-${TAG_NAME}.aab
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/FaceAttendance-*.apk
            app/build/outputs/bundle/release/FaceAttendance-*.aab
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
