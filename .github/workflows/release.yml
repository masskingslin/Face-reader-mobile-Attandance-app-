name: Build & Publish Release (APK + AAB)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK & Bundle (AAB)
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Organize and Rename Binaries
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/FaceAttendance-${TAG_NAME}.apk
          
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/FaceAttendance-${TAG_NAME}.aab
          
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt \
               app/build/outputs/mapping/release/mapping-${TAG_NAME}.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/FaceAttendance-*.apk
            app/build/outputs/bundle/release/FaceAttendance-*.aab
            app/build/outputs/mapping/release/mapping-*.txt
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
