name: Build & Publish Release (APK + AAB)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Binaries & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Runtime
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Wrapper if Missing
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating wrapper..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Release APK & Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Organize Artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          
          # Find and copy generated APK
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} FaceAttendance-${TAG_NAME}.apk \;
          
          # Find and copy generated AAB
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} FaceAttendance-${TAG_NAME}.aab \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FaceAttendance-*.apk
            FaceAttendance-*.aab
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
